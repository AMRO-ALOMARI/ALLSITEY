name: Deploy Vite + React to GitHub Pages

on:
  push:
    branches:
      - main   # ينفّذ كل ما تدفع على main
  workflow_dispatch:  # يسمح تشغيل يدوي من GitHub Actions
  
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
